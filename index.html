<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamün Alekyüm</title>
    <style>
        body {
            font-size: 20px;
            position: relative;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        /* Giriş Ekranı Tasarımı */
        #welcomeScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        #startButton {
            font-size: 3em;
            padding: 20px 50px;
            cursor: pointer;
            border-radius: 15px;
            border: none;
            background-color: #ff4757;
            color: white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: transform 0.2s, background-color 0.2s;
        }

        #startButton:hover {
            transform: scale(1.1);
            background-color: #ff6b81;
        }

        /* Ana İçerik Kaplayıcısı (İlk başta gizli) */
        #mainContent {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
            box-sizing: border-box;
            padding: 20px;
        }
        
        h1 {
            font-size: 2em;
            margin-top: 0;
        }
        
        .action-btn {
            font-size: 1.5em;
            padding: 10px 20px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        #noButton {
            position: absolute;
        }

        #mainImage {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 300px;
        }

        /* Tam ekran PNG */
        #overlayImage {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            cursor: pointer;
            z-index: 9999;
        }
    </style>
</head>
<body>

    <!-- KOCAMAN BAŞLA BUTONU (GİRİŞ EKRANI) -->
    <div id="welcomeScreen">
        <button id="startButton">BAŞLA 🚀</button>
    </div>

    <!-- SİTENİN ASIL İÇERİĞİ -->
    <div id="mainContent">
        <h1 id="mainTitle">Naaber Deryiaaaa</h1>
        <img id="mainImage" src="https://upload.wikimedia.org/wikipedia/tr/9/97/%C5%9Eim%C5%9Fek_McQueen.jpg" alt="Şimşek McQueen">
        <button id="yesButton" class="action-btn">Çok Güzel</button>
        <button id="noButton" class="action-btn">Kötü</button>
    </div>

    <!-- Müzik elementi -->
    <audio id="bgMusic" src="müzik2.mp3" loop></audio>

    <!-- Tam ekran PNG -->
    <img id="overlayImage" src="https://cdn.discordapp.com/attachments/1076118865014173759/1458186850127843379/Adsz.png?ex=695eb9d4&is=695d6854&hm=12d228ff67eb26869e16a2e4642c0512a3fd93ab35c4c5b2e7bc47497ce49d9d&" alt="Overlay">

    <script>
        const welcomeScreen = document.getElementById("welcomeScreen");
        const startButton = document.getElementById("startButton");
        const mainContent = document.getElementById("mainContent");
        
        const noButton = document.getElementById("noButton");
        const yesButton = document.getElementById("yesButton");
        const title = document.getElementById("mainTitle");
        const image = document.getElementById("mainImage");
        const overlayImage = document.getElementById("overlayImage");
        const bgMusic = document.getElementById("bgMusic");

        const texts = ["Eminmisin", "çok iyisin", "Abartmıyalım", "Ben Hızım...", "XD", "Durdurla"];
        let index = 0;
        let scale = 1;
        let step = 0; // 0 = ilk ekran, 1 = ikinci ekran

        // BAŞLA BUTONUNA BASILINCA ÇALIŞACAK KISIM
        startButton.addEventListener("click", function() {
            // Müziği kesin olarak başlatır
            bgMusic.play().catch(error => console.log("Müzik açma hatası:", error));
            
            // Giriş ekranını gizle, ana oyun ekranını göster
            welcomeScreen.style.display = "none";
            mainContent.style.display = "block";
        });

        function resetButtons() {
            scale = 1;
            yesButton.style.transform = "scale(1)";
            yesButton.innerText = "Evet";
            noButton.innerText = "Yook";
            noButton.style.left = "";
            noButton.style.top = "";
        }

        function moveNoButton() {
            const buttonRect = noButton.getBoundingClientRect();
            const x = Math.floor(Math.random() * (window.innerWidth - buttonRect.width));
            const y = Math.floor(Math.random() * (window.innerHeight - buttonRect.height));
            noButton.style.left = x + "px";
            noButton.style.top = y + "px";

            noButton.innerText = texts[index % texts.length];
            index++;

            scale += 0.1;
            yesButton.style.transform = `scale(${scale})`;
        }

        noButton.addEventListener("mouseover", moveNoButton);

        document.addEventListener("mousemove", function(event) {
            // Eğer ana ekran henüz açılmadıysa buton kaçırma mantığını çalıştırma
            if (welcomeScreen.style.display === "none") {
                const buttonRect = noButton.getBoundingClientRect();
                const x = event.clientX;
                const y = event.clientY;
                if (x >= buttonRect.left && x <= buttonRect.right && y >= buttonRect.top && y <= buttonRect.bottom) {
                    moveNoButton();
                }
            }
        });

        yesButton.addEventListener("click", function() {
            if (step === 0) {
                title.innerText = "Benle pese gelecekmisin??";
                image.src = "https://kartalyuvasi.mncdn.com/mnresize/1200/-/kartalyuvasi/UPLOAD/PRODUCTS/5KS4B0100001-02_1.jpg"; 
                resetButtons();
                step = 1;
            } else if (step === 1) {
                overlayImage.style.display = "block";
            }
        });

        overlayImage.addEventListener("click", function() {
            window.open("https://www.whatsapp.com/?lang=tr", "_blank");
        });
    </script>
</body>
</html>
